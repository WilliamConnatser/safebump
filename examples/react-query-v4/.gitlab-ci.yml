# safebump on every dependency-update merge request (Renovate or anyone else).
# The same design as .github/workflows/safebump.yml.
#
# safebump:      the assurance job (no agent, no LLM cost). It fails, failing
#                the pipeline, when the upgrade is broken. It posts a sticky MR
#                note, and a commit status `safebump/automerge` that is
#                "success" only for low-risk updates. With Renovate's
#                `platformAutomerge: false` (see renovate.json), Renovate merges
#                only after every check has passed, so that status vetoes
#                auto-merge of anything not proven low-risk.
#                Caveat: GitLab attaches API-posted statuses to the MR's
#                pipeline. If the project requires pipelines to succeed, a
#                vetoed MR may need a maintainer override to merge by hand.
#                Check this on your instance; set SAFEBUMP_AUTOMERGE_STATUS=off
#                to skip the status and keep the note only.
# safebump-fix:  only when the assurance found fixable problems and
#                SAFEBUMP_AGENT is set. It writes characterization tests on the
#                base version first, fixes the upgrade, re-runs the assurance,
#                and pushes.
#
# CI/CD variables (Settings → CI/CD → Variables):
#   SAFEBUMP_GITLAB_TOKEN  project access token, role Developer, scopes
#                          api + write_repository (MR notes, statuses, push).
#                          Masked and protected as appropriate.
#   SAFEBUMP_AGENT         claude | codex | gemini | custom | off (default: off)
#   SAFEBUMP_AGENT_CMD     the command for "custom"
#   SAFEBUMP_TYPECHECK     optional type-check command override
#   ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN / OPENAI_API_KEY / GEMINI_API_KEY

.safebump:
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/package.json"
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
        - "**/bun.lock"
        - "**/bun.lockb"
  variables:
    GIT_DEPTH: 0
    BASE_REF: origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    SAFEBUMP: /opt/safebump/skills/safebump/scripts/safebump
  before_script:
    - git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/WilliamConnatser/safebump.git /opt/safebump
    - git -C /opt/safebump sparse-checkout set skills/safebump
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      cat > /tmp/install.sh <<'EOF'
      if [ -f bun.lock ] || [ -f bun.lockb ]; then command -v bun >/dev/null || npm install -g bun; bun install --frozen-lockfile
      elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
      elif [ -f yarn.lock ]; then corepack enable && yarn install
      else npm ci
      fi
      EOF
    - bash /tmp/install.sh
    # failures that already exist on the target branch aren't this MR's
    - git worktree add --detach /tmp/base "$BASE_REF"
    - (cd /tmp/base && bash /tmp/install.sh && "$SAFEBUMP" verify baseline)
    - mkdir -p .safebump && cp /tmp/base/.safebump/baseline.json .safebump/

safebump:
  extends: .safebump
  stage: test
  script:
    - set +e; "$SAFEBUMP" ci --base "$BASE_REF" --markdown safebump.md --outputs safebump.env; code=$?; set -e
    - |
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      auth="PRIVATE-TOKEN: $SAFEBUMP_GITLAB_TOKEN"
      . ./safebump.env
      body=$(printf '<!-- safebump -->\n%s' "$(cat safebump.md)")
      note=$(curl -sf -H "$auth" "$api/merge_requests/$CI_MERGE_REQUEST_IID/notes?per_page=100" \
        | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const n=JSON.parse(d).find(n=>n.body.startsWith("<!-- safebump -->"));console.log(n?n.id:"")})')
      if [ -n "$note" ]; then
        curl -sf -X PUT -H "$auth" --data-urlencode "body=$body" "$api/merge_requests/$CI_MERGE_REQUEST_IID/notes/$note" > /dev/null
      else
        curl -sf -X POST -H "$auth" --data-urlencode "body=$body" "$api/merge_requests/$CI_MERGE_REQUEST_IID/notes" > /dev/null
      fi
      if [ "${SAFEBUMP_AUTOMERGE_STATUS:-on}" != "off" ]; then
        if [ "$BLOCKED" != "true" ] && [ "$RISK" = "low" ]; then state=success; desc="Low risk: eligible to auto-merge"
        else state=failed; desc="Risk $RISK: needs a human review"; fi
        curl -sf -X POST -H "$auth" --data-urlencode "name=safebump/automerge" --data-urlencode "state=$state" \
          --data-urlencode "description=$desc" --data-urlencode "ref=$CI_COMMIT_REF_NAME" \
          "$api/statuses/$CI_COMMIT_SHA" > /dev/null
      fi
    - exit $code
  artifacts:
    when: always
    paths: [safebump.md]
    reports:
      dotenv: safebump.env

safebump-fix:
  extends: .safebump
  stage: deploy
  needs:
    - job: safebump
      artifacts: true
  # runs even when the assurance failed: that's often exactly when it's needed
  when: always
  timeout: 90m
  script:
    - |
      if [ "$NEEDS_AGENT" != "true" ] || [ -z "$SAFEBUMP_AGENT" ] || [ "$SAFEBUMP_AGENT" = "off" ]; then
        echo "Nothing for the agent to do (NEEDS_AGENT=$NEEDS_AGENT, SAFEBUMP_AGENT=${SAFEBUMP_AGENT:-off})"; exit 0
      fi
    - git checkout -B "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "$CI_COMMIT_SHA"
    - |
      cat > /tmp/prompt.md <<EOF
      Read and follow the skill at /opt/safebump/skills/safebump/SKILL.md, in unattended mode, section "CI fix mode".

      This is a dependency-update merge request. The target branch is checked out, with its dependencies installed, at:
        /tmp/base
      safebump's assurance report for this MR is at $CI_PROJECT_DIR/safebump.md.

      Write your report to /tmp/report.md.
      EOF
    - export SAFEBUMP_PROMPT_FILE=/tmp/prompt.md; PROMPT="$(cat /tmp/prompt.md)"
    - |
      case "$SAFEBUMP_AGENT" in
        claude) npm install -g @anthropic-ai/claude-code && claude -p "$PROMPT" --dangerously-skip-permissions ;;
        codex)  npm install -g @openai/codex && printenv OPENAI_API_KEY | codex login --with-api-key && codex exec --dangerously-bypass-approvals-and-sandbox "$PROMPT" ;;
        gemini) npm install -g @google/gemini-cli && gemini -p "$PROMPT" --yolo ;;
        custom) bash -c "$SAFEBUMP_AGENT_CMD" ;;
        *) echo "Unknown SAFEBUMP_AGENT: $SAFEBUMP_AGENT" >&2; exit 1 ;;
      esac
    # the same assurance on the agent's result; the pushed commit starts a new
    # pipeline, which runs the safebump job again
    - git worktree remove --force /tmp/base
    - '"$SAFEBUMP" ci --base "$BASE_REF" --markdown safebump-after.md || true'
    - git config user.name "safebump[bot]" && git config user.email "safebump@noreply.invalid"
    - git add -A -- . ':!.safebump' ':!safebump.md' ':!safebump-after.md' ':!safebump.env'
    - 'if git diff --cached --quiet; then echo "The agent made no changes"; exit 0; fi'
    # project git hooks may refuse CI commits; the re-assurance above is the gate
    - git commit --no-verify -m "fix(deps): adapt code to the dependency upgrade" -m "Applied by the safebump fix job."
    - git push "https://oauth2:${SAFEBUMP_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
