# Runs the safebump skill on any PR that changes dependencies and breaks the
# type check, then pushes the fixes to the PR branch. It doesn't matter who
# opened the PR: Dependabot, Renovate, another bot or a person.
#
# Configure under Settings → Secrets and variables → Actions:
#
#   Variable SAFEBUMP_AGENT: claude | codex | gemini | custom   (default: claude)
#   Variable SAFEBUMP_TYPECHECK (optional): type-check command, if detection
#            picks the wrong one
#
#   Secret for the agent you picked:
#     claude  CLAUDE_CODE_OAUTH_TOKEN (subscription, from `claude setup-token`)
#             or ANTHROPIC_API_KEY
#     codex   OPENAI_API_KEY
#     gemini  GEMINI_API_KEY
#     custom  set variable SAFEBUMP_AGENT_CMD to a shell command that runs your
#             agent headless. The prompt's path is in $SAFEBUMP_PROMPT_FILE.
#             Put any keys it needs in secrets and add them to the "Fix" step.
#
# Some update bots trigger workflows that can only read the bot's own secret
# store. Dependabot is one: add the same secret under Secrets → Dependabot too.
name: safebump

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/bun.lock"
      - "**/bun.lockb"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: safebump-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  safebump:
    # skip PRs from forks: their branches can't be pushed to with this token
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_REF: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # the agent step runs untrusted text (release notes, package docs);
          # keep the push token out of the working copy
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the safebump skill
        uses: actions/checkout@v4
        with:
          repository: WilliamConnatser/safebump
          path: ${{ runner.temp }}/safebump
          sparse-checkout: skills/safebump
          persist-credentials: false

      - name: Install dependencies
        run: |
          cat > "$RUNNER_TEMP/install.sh" <<'EOF'
          if [ -f bun.lock ] || [ -f bun.lockb ]; then command -v bun >/dev/null || npm install -g bun; bun install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install
          else npm ci
          fi
          EOF
          bash "$RUNNER_TEMP/install.sh"

      # uses the project's own checker (typecheck script, ts-rust, tsgo,
      # vue-tsc or tsc); set the SAFEBUMP_TYPECHECK variable to override
      - name: Type check
        id: tsc
        env:
          SAFEBUMP_TYPECHECK: ${{ vars.SAFEBUMP_TYPECHECK }}
        run: |
          if "$RUNNER_TEMP/safebump/skills/safebump/scripts/safebump" tsc; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      # a broken install or missing checker produces errors that look like
      # upgrade breakage; stop before spending an agent run on them
      - name: Preflight
        if: steps.tsc.outputs.clean == 'false'
        env:
          SAFEBUMP_TYPECHECK: ${{ vars.SAFEBUMP_TYPECHECK }}
        run: |
          "$RUNNER_TEMP/safebump/skills/safebump/scripts/safebump" doctor

      # failures that already exist on the base branch aren't the agent's to
      # fix; record them so `verify` only reports new ones
      - name: Baseline on the base branch
        if: steps.tsc.outputs.clean == 'false'
        env:
          SAFEBUMP_TYPECHECK: ${{ vars.SAFEBUMP_TYPECHECK }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_REF"
          cd "$RUNNER_TEMP/base"
          bash "$RUNNER_TEMP/install.sh"
          "$RUNNER_TEMP/safebump/skills/safebump/scripts/safebump" verify baseline
          mkdir -p "$GITHUB_WORKSPACE/.safebump"
          cp .safebump/baseline.json "$GITHUB_WORKSPACE/.safebump/"
          printf '*\n' > "$GITHUB_WORKSPACE/.safebump/.gitignore"

      - name: Write the prompt
        if: steps.tsc.outputs.clean == 'false'
        run: |
          cat > "$RUNNER_TEMP/safebump-prompt.md" <<EOF
          Read and follow the skill at $RUNNER_TEMP/safebump/skills/safebump/SKILL.md, in its unattended mode.

          This branch already bumps one or more dependencies in package.json, and dependencies are installed.
          Find what was bumped with: $RUNNER_TEMP/safebump/skills/safebump/scripts/safebump detect $BASE_REF
          Run plan on those packages and complete the upgrade set if the bot bumped only part of it.
          Then fix the code. A verify baseline from the base branch is already recorded.

          Write your report to $RUNNER_TEMP/safebump-report.md.
          EOF

      - name: Fix
        if: steps.tsc.outputs.clean == 'false'
        env:
          SAFEBUMP_AGENT: ${{ vars.SAFEBUMP_AGENT || 'claude' }}
          SAFEBUMP_AGENT_CMD: ${{ vars.SAFEBUMP_AGENT_CMD }}
          SAFEBUMP_PROMPT_FILE: ${{ runner.temp }}/safebump-prompt.md
          SAFEBUMP_TYPECHECK: ${{ vars.SAFEBUMP_TYPECHECK }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # The runner is a throwaway VM with no push credentials, so each agent
        # runs without its own sandbox or permission prompts. Flags change
        # between releases; check your agent's docs for headless mode.
        run: |
          PROMPT="$(cat "$SAFEBUMP_PROMPT_FILE")"
          case "$SAFEBUMP_AGENT" in
            claude)
              npm install -g @anthropic-ai/claude-code
              claude -p "$PROMPT" --dangerously-skip-permissions
              ;;
            codex)
              npm install -g @openai/codex
              printenv OPENAI_API_KEY | codex login --with-api-key
              codex exec --dangerously-bypass-approvals-and-sandbox "$PROMPT"
              ;;
            gemini)
              npm install -g @google/gemini-cli
              gemini -p "$PROMPT" --yolo
              ;;
            custom)
              bash -c "$SAFEBUMP_AGENT_CMD"
              ;;
            *)
              echo "Unknown SAFEBUMP_AGENT: $SAFEBUMP_AGENT" >&2
              exit 1
              ;;
          esac

      # don't take the agent's word for it
      - name: Verify and audit
        id: gates
        if: steps.tsc.outputs.clean == 'false'
        env:
          SAFEBUMP_TYPECHECK: ${{ vars.SAFEBUMP_TYPECHECK }}
        run: |
          B="$RUNNER_TEMP/safebump/skills/safebump/scripts/safebump"
          status=0
          { echo "## safebump checks"; echo; echo '```'; } > "$RUNNER_TEMP/gates.md"
          "$B" verify >> "$RUNNER_TEMP/gates.md" 2>&1 || status=1
          "$B" audit HEAD >> "$RUNNER_TEMP/gates.md" 2>&1 || status=1
          echo '```' >> "$RUNNER_TEMP/gates.md"
          echo "ok=$([ $status = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.tsc.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(deps): adapt code to dependency upgrade"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.head_ref }}"
          fi
          report="$RUNNER_TEMP/safebump-report.md"
          [ -f "$report" ] || "$RUNNER_TEMP/safebump/skills/safebump/scripts/safebump" report "$BASE_REF" > "$report"
          if [ "${{ steps.gates.outputs.ok }}" != "true" ]; then
            printf '> [!WARNING]\n> safebump checks failed; see below before merging.\n\n' | cat - "$report" > "$report.tmp" && mv "$report.tmp" "$report"
          fi
          cat "$RUNNER_TEMP/gates.md" >> "$report"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$report"

      - name: Fail if checks failed
        if: steps.gates.outputs.ok == 'false'
        run: exit 1
